name: Update contribution heatmap

on:
  schedule:
    - cron: "30 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch real contributions and re-render heatmap
        run: |
          python scripts/fetch_contributions.py
          python scripts/render_heatmap.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contributions.json assets/heatmap.svg
          git diff --cached --quiet || git commit -m "chore: refresh contribution heatmap [skip ci]"
          git push
