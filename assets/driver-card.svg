<svg xmlns="http://www.w3.org/2000/svg" width="880" height="436" viewBox="0 0 880 436" role="img" aria-label="Driver card — whoami">
<style>
  .bg { fill: #0a0f1a; }
  .bar { fill: #111a2b; }
  .k { font: 700 15.5px ui-monospace, Menlo, Consolas, monospace; fill: #7eb6e8; }
  .v { font: 15.5px ui-monospace, Menlo, Consolas, monospace; fill: #dcebfb; }
  .dim { font: 15.5px ui-monospace, Menlo, Consolas, monospace; fill: #5b6b82; }
  .cmd { font: 700 16px ui-monospace, Menlo, Consolas, monospace; fill: #eaf6ff; }
  .ttl { font: 13px ui-monospace, Menlo, monospace; fill: #9db8d6; }
  .row { animation: print .5s ease-out both; }
  @keyframes print { from { opacity: 0; transform: translateX(-9px); } to { opacity: 1; transform: translateX(0); } }
  .cur { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 0%, 55% { opacity: 1; } 56%, 100% { opacity: 0; } }
</style>
<rect class="bg" width="880" height="436" rx="12"/>
<rect class="bar" width="880" height="38" rx="12"/>
<rect class="bar" y="26" width="880" height="12"/>
<circle cx="24" cy="19" r="6" fill="#e22739"/>
<circle cx="46" cy="19" r="6" fill="#16588e"/>
<circle cx="68" cy="19" r="6" fill="#7eb6e8"/>
<text x="440" y="24" text-anchor="middle" class="ttl">abhi@touge: ~/whoami --driver</text>

<text x="30" y="76" class="row" style="animation-delay:.15s"><tspan class="dim">abhi@touge</tspan><tspan class="v">:</tspan><tspan class="k">~</tspan><tspan class="cmd"> $ whoami --driver</tspan></text>

<text x="30" y="112" class="row" style="animation-delay:.45s"><tspan class="k">DRIVER&#160;&#160;</tspan><tspan class="v">Sarfira — a little crazy, fully committed. Papers say M S Abhishek.</tspan></text>
<text x="30" y="142" class="row" style="animation-delay:.7s"><tspan class="k">BASE&#160;&#160;&#160;&#160;</tspan><tspan class="v">Meerut » wherever the road goes</tspan></text>
<text x="30" y="172" class="row" style="animation-delay:.95s"><tspan class="k">ENGINE&#160;&#160;</tspan><tspan class="v">management × building — code is just the engine; he drives the race</tspan></text>
<text x="30" y="202" class="row" style="animation-delay:1.2s"><tspan class="k">FUEL&#160;&#160;&#160;&#160;</tspan><tspan class="v">Maggi, deadlines &amp; stubbornness</tspan></text>
<text x="30" y="232" class="row" style="animation-delay:1.45s"><tspan class="k">1ST WIN&#160;</tspan><tspan class="v">VidyaSathi — a borrowed laptop, 1 AM » 6 AM, first trophy</tspan></text>
<text x="30" y="262" class="row" style="animation-delay:1.7s"><tspan class="k">CREW&#160;&#160;&#160;&#160;</tspan><tspan class="v">family first · Aayushi, Chhavi, Rajnish, Rashtrapati,</tspan></text>
<text x="30" y="290" class="row" style="animation-delay:1.85s"><tspan class="v">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;Jay Prakash, Bhavya, Adrika, Piyush · + Ashish, Khushi,</tspan></text>
<text x="30" y="318" class="row" style="animation-delay:2s"><tspan class="v">&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;&#160;Abhay, Anurag — they paid his bills; he owes them the garage</tspan></text>
<text x="30" y="348" class="row" style="animation-delay:2.25s"><tspan class="k">BOSSES&#160;&#160;</tspan><tspan class="v">luck &amp; money — status: still fighting, still winning nights</tspan></text>
<text x="30" y="378" class="row" style="animation-delay:2.5s"><tspan class="k">RULE&#160;&#160;&#160;&#160;</tspan><tspan class="v">"It takes nothing to be kind."</tspan></text>
<text x="30" y="408" class="row" style="animation-delay:2.75s"><tspan class="k">ENDGAME </tspan><tspan class="v">freedom » a small café in the hills, name unknown</tspan><tspan class="cur" fill="#7eb6e8"> &#9612;</tspan></text>
</svg>
